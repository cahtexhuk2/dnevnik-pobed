<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Первый огонь</title>
  <desc id="desc">Золотая награда Дневника Побед за 7 дней подряд</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f7d36a"/>
      <stop offset="28%" stop-color="#8d5b24"/>
      <stop offset="62%" stop-color="#17231f"/>
      <stop offset="100%" stop-color="#07110f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="28%" stop-color="#d39a2c"/>
      <stop offset="60%" stop-color="#8b541e"/>
      <stop offset="100%" stop-color="#f4d06a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
