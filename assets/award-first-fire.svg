  <text x="600" y="764" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="90" font-weight="900" fill="url(#gold)" stroke="#3b220d" stroke-width="3">ОГОНЬ</text>
  <text x="600" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#f8e7a4">7 ДНЕЙ ПОДРЯД</text>
