      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 0.68 0 0 0.42 0 0 0.18 0 0 0 0 0 .85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#08110f"/>
  <circle cx="600" cy="405" r="360" fill="url(#sky)"/>
  <circle cx="600" cy="405" r="382" fill="none" stroke="url(#gold)" stroke-width="22"/>
  <circle cx="600" cy="405" r="414" fill="none" stroke="#b77927" stroke-width="6" opacity=".75"/>

  <g opacity=".5" stroke="#d7a23b" stroke-width="4" fill="none">
    <path d="M170 405c180-120 300-165 430-165s250 45 430 165"/>
    <path d="M160 520c160 90 300 135 440 135s280-45 440-135"/>
  </g>

  <g filter="url(#glow)">
    <path d="M600 120c58 95 35 142 0 191-37 52-48 98 0 154 48-56 37-102 0-154-35-49-58-96 0-191z" fill="#f5c84b"/>
    <path d="M600 224c34 61 13 91-10 120-28 35-24 75 10 112 34-37 38-77 10-112-23-29-44-59-10-120z" fill="#fff1a8" opacity=".9"/>
  </g>

  <g>
