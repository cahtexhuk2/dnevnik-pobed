<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Новая привычка</title>
  <desc id="desc">Изумрудно-золотая награда Дневника Побед за 21 день подряд</desc>
  <defs>
    <radialGradient id="aura" cx="50%" cy="34%" r="61%">
      <stop offset="0%" stop-color="#fff4b3"/>
      <stop offset="22%" stop-color="#66c095"/>
      <stop offset="48%" stop-color="#1b5744"/>
      <stop offset="100%" stop-color="#06110f"/>
    </radialGradient>
    <linearGradient id="gold" x1="10%" y1="8%" x2="90%" y2="96%">
      <stop offset="0%" stop-color="#fff8c9"/>
      <stop offset="24%" stop-color="#e8ba52"/>
      <stop offset="50%" stop-color="#9c641f"/>
      <stop offset="78%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#a86621"/>
    </linearGradient>
    <linearGradient id="emerald" x1="14%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#7ddfb2"/>
      <stop offset="56%" stop-color="#275f4f"/>
      <stop offset="100%" stop-color="#0e201c"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values=".7 0 0 0 .55 0 1 0 0 .82 0 0 .45 0 .24 0 0 0 .9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020504" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#06110f"/>
  <circle cx="600" cy="402" r="390" fill="url(#aura)"/>
  <circle cx="600" cy="402" r="435" fill="none" stroke="url(#gold)" stroke-width="22"/>
  <circle cx="600" cy="402" r="480" fill="none" stroke="#75c79d" stroke-width="8" opacity=".45"/>
  <circle cx="600" cy="402" r="322" fill="none" stroke="#f4cc68" stroke-width="4" opacity=".45"/>

  <g filter="url(#glow)">
    <path d="M600 108c98 124 38 184 2 237-39 57-39 108-2 160 72-78 56-138 16-194-34-48-72-92-16-203z" fill="#ffe06a"/>
    <path d="M557 282c33 70 4 103-20 140-19 31-11 64 20 100 49-44 56-86 28-129-22-34-47-62-28-111z" fill="#a9f2c8" opacity=".95"/>
    <path d="M647 262c-9 56 14 88 36 121 28 43 20 86-28 135-19-45-7-83 14-119 19-32 25-70-22-137z" fill="#fff0a2" opacity=".92"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M182 575 382 316l108 150 91-126 184 235z" fill="#0d1815"/>
    <path d="M382 316 490 466l-93-35-124 144h-91z" fill="url(#emerald)"/>
    <path d="M581 340 765 575H470z" fill="#173229"/>
    <path d="M343 367 382 316l44 61-48-13zM554 377l27-37 46 59-47-12z" fill="#fff0c8"/>
  </g>

  <g transform="translate(600 586)">
    <circle r="82" fill="#07110f" stroke="url(#gold)" stroke-width="12"/>
    <text y="22" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#f7d46c">21</text>
  </g>

  <rect x="185" y="662" width="830" height="155" rx="30" fill="#07100e" opacity=".76"/>
  <text x="600" y="726" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" fill="url(#gold)" stroke="#33200d" stroke-width="3">НОВАЯ ПРИВЫЧКА</text>
  <text x="600" y="778" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="900" fill="#e6ffd8">21 ДЕНЬ ПОДРЯД</text>
  <text x="600" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#cde9ce" letter-spacing="2">ДНЕВНИК ПОБЕД</text>
</svg>
